name: Bug report
description: Something looks wrong, crashes, or lags.. etc
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead or etc.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: For anything visual, this helps more than anything else!
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Where you were (biome, dimension, weather, time of day) and what you did.
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "0.90"
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Modpack or mod list
      description: Modpack name and version, or a link to your mod list.
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Upload logs.
